<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code with Harshit - World's No.1 Python AI Studio</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --panel-bg: #1e1f20;
            --border-color: #333538;
            --text-color: #e3e3e3;
            --accent-color: #a8c7fa;
            --accent-glow: rgba(168, 199, 250, 0.15);
            --button-bg: #282a2c;
            --button-hover: #3c4043;
            --user-bubble: #2b2d31;
            --ai-bubble: #1e1f20;
        }

        /* Pro Hacker Theme Override */
        .matrix-theme {
            --bg-color: #050505;
            --sidebar-bg: #111411;
            --panel-bg: #111411;
            --border-color: #00ff66;
            --text-color: #00ff66;
            --accent-color: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.25);
            --button-bg: #002200;
            --button-hover: #004400;
            --user-bubble: #003311;
            --ai-bubble: #111411;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Inter, system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* 🚀 3D Cinematic Space Warp Intro Animation */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s ease;
        }

        .space-code {
            position: absolute;
            color: rgba(168, 199, 250, 0.25);
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
            animation: warpSpeed 1.5s linear infinite;
        }

        @keyframes warpSpeed {
            0% { transform: scale(0.1) translateZ(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(3) translateZ(500px); opacity: 0; }
        }

        .intro-title {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #a8c7fa, 0 0 40px #1f1f23;
            z-index: 2;
            animation: cinematicBlast 1.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes cinematicBlast {
            0% { transform: scale(0.2); opacity: 0; filter: blur(30px); }
            50% { transform: scale(1.15); opacity: 1; filter: blur(0px); text-shadow: 0 0 50px #a8c7fa; }
            100% { transform: scale(1); opacity: 1; }
        }

        .smoke-dissolve {
            opacity: 0 !important;
            filter: blur(30px) contrast(250%) brightness(150%);
            transform: scale(1.4);
            pointer-events: none;
        }

        /* Left Sidebar (Live History Layout) */
        .sidebar {
            width: 290px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            padding: 16px;
            gap: 12px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 4px;
        }
        .brand-logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #a8c7fa, #72b5f5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-btn {
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            text-align: left;
        }
        .sidebar-btn:hover {
            background: var(--button-hover);
            border-color: #5f6368;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* History Section Groups (Today, Yesterday) */
        .history-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-group-title {
            font-size: 11px;
            font-weight: 700;
            color: #9aa0a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 10px;
            margin-top: 6px;
        }
        .chats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chats-list li {
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #bdc1c6;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chats-list li:hover {
            background: var(--button-bg);
            color: var(--text-color);
        }

        .sidebar-footer-note {
            font-size: 11px;
            color: #80868b;
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-weight: 600;
        }

        /* Main Workspace Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
        }

        .header {
            background: var(--bg-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .studio-mode-indicator {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-btn {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .control-btn:hover {
            background: var(--button-hover);
            border-color: #5f6368;
        }

        .status-badge {
            font-size: 11px;
            background: rgba(52, 168, 83, 0.15);
            border: 1px solid #34a853;
            padding: 6px 14px;
            border-radius: 20px;
            color: #81c995;
            font-weight: 600;
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeInMessage 0.3s ease-out;
            position: relative;
        }
        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-msg {
            background: var(--user-bubble);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        /* Matrix Code Rain Searching Animation */
        .searching-box {
            background: var(--ai-bubble);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            align-self: flex-start;
            padding: 14px 22px;
            border-radius: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            position: relative;
            overflow: hidden;
            min-width: 280px;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .matrix-rain-text {
            display: inline-block;
            animation: codeJharneLage 0.4s linear infinite;
        }
        @keyframes codeJharneLage {
            0% { transform: translateY(-3px); opacity: 0.7; }
            50% { transform: translateY(3px); opacity: 1; text-shadow: 0 0 8px var(--accent-color); }
            100% { transform: translateY(-3px); opacity: 0.7; }
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: var(--button-hover);
        }

        .input-wrapper {
            max-width: 900px;
            width: 100%;
            margin: 0 auto 20px auto;
            padding: 0 24px;
        }
        .input-area {
            background: #1e1f20;
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 10px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: var(--text-color);
            outline: none;
            font-size: 14px;
        }
        .action-btn {
            background: #a8c7fa;
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: #c4d7ff;
        }
        .snippet-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        .snippet-btn:hover {
            background: var(--button-hover);
        }
    </style>
</head>
<body id="bodyTag">

    <!-- 🚀 3D Cinematic Space Warp Intro Animation -->
    <div id="loader">
        <div id="spaceWarpContainer"></div>
        <div class="intro-title">Code With Harshit</div>
    </div>

    <!-- Left Sidebar: Live History Layout -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo-icon">H</div>
            Code With Harshit
        </div>
        
        <button class="sidebar-btn" onclick="startNewChat()">➕ New Chat</button>
        <button class="sidebar-btn" onclick="searchCodes()">🔍 Search Codes</button>
        
        <div class="history-container">
            <div class="history-group-title">Today</div>
            <ul class="chats-list" id="todayChatsList"></ul>

            <div class="history-group-title">Yesterday / Saved</div>
            <ul class="chats-list" id="yesterdayChatsList"></ul>
        </div>

        <div class="sidebar-footer-note">AI Can Learn Python Only</div>
    </div>

    <!-- Main Workspace Area -->
    <div class="main-container">
        <div class="header">
            <div class="studio-mode-indicator">
                ⚡ Python AI Studio HD
            </div>
            
            <div class="controls-group">
                <span class="status-badge">🟢 Live Engine</span>
                <button class="control-btn" onclick="toggleVoice()" id="voiceToggleBtn">🔊 Audio: ON</button>
                <button class="control-btn" onclick="toggleMode()" id="modeToggleBtn">🔥 Desi: OFF</button>
                <button class="control-btn" onclick="toggleTheme()">⚡ Theme</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Namaste bhai! Main **"Code with Harshit"** hoon. Batao aaj Python me kya seekhna hai?<button class="copy-btn" onclick="copyText(this)">📋 Copy</button></div>
        </div>

        <div class="input-wrapper">
            <form class="input-area" id="chatForm">
                <input type="text" id="userInput" placeholder="Yahan apna Python sawal likho..." autocomplete="off" required>
                <button type="button" class="snippet-btn" onclick="insertSnippet()">💡 Snippet</button>
                <button type="submit" class="action-btn">Send</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Pro Logic -->
    <script>
        let voiceEnabled = true;
        let isMatrixTheme = false;
        let desiModeActive = false;
        let currentChatId = 'chat_' + Date.now(); // Unique session ID for current chat

        // 🌌 Generate 3D Space Warp Flying Codes
        const warpContainer = document.getElementById('spaceWarpContainer');
        const pythonSnippets = [
            "print('Hello')", "def harshit():", "import flask", "for i in range(10):", 
            "if x == y:", "class PythonAI:", "return response", "pip install gemini", 
            "app.run(debug=True)", "name = 'Harshit'", "async def chat():", "try: ... except:"
        ];

        for (let i = 0; i < 45; i++) {
            let span = document.createElement('span');
            span.className = 'space-code';
            span.innerText = pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)];
            span.style.left = (Math.random() * 90 + 5) + 'vw';
            span.style.top = (Math.random() * 90 + 5) + 'vh';
            span.style.animationDuration = (Math.random() * 1 + 1.2) + 's';
            span.style.animationDelay = (Math.random() * 0.8) + 's';
            warpContainer.appendChild(span);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.classList.add('smoke-dissolve');
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 2200);
            renderHistorySidebar();
        });

        // 🛑 Live Speech Stopper
        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function copyText(btn) {
            let messageDiv = btn.parentElement;
            let textToCopy = messageDiv.innerText.replace('📋 Copy', '').trim();
            navigator.clipboard.writeText(textToCopy);
            btn.innerText = '✅ Copied!';
            setTimeout(() => { btn.innerText = '📋 Copy'; }, 2000);
        }

        // 📂 Save Full Chat Session to LocalStorage
        function saveCurrentChatState() {
            const chatBox = document.getElementById('chatBox');
            if (!chatBox) return;

            let allSessions = JSON.parse(localStorage.getItem('harshit_chat_sessions')) || {};
            
            // Title pehla user message ya default hoga
            let firstUserMsg = chatBox.querySelector('.user-msg');
            let chatTitle = firstUserMsg ? firstUserMsg.innerText.substring(0, 25) + '...' : 'Python Chat Session';

            allSessions[currentChatId] = {
                title: chatTitle,
                html: chatBox.innerHTML,
                time: 'Today'
            };
            localStorage.setItem('harshit_chat_sessions', JSON.stringify(allSessions));
            renderHistorySidebar();
        }

        function renderHistorySidebar() {
            let allSessions = JSON.parse(localStorage.getItem('harshit_chat_sessions')) || {};
            let todayList = document.getElementById('todayChatsList');
            let yesterdayList = document.getElementById('yesterdayChatsList');
            
            todayList.innerHTML = '';
            yesterdayList.innerHTML = '';

            let keys = Object.keys(allSessions).reverse(); // Newest first
            keys.forEach((id, index) => {
                let session = allSessions[id];
                let listItem = `<li onclick="loadChatSession('${id}')">💬 ${session.title}</li>`;
                
                // Pehli 3 chats Today me, baaki sab Yesterday me
                if(index < 3) {
                    todayList.innerHTML += listItem;
                } else {
                    yesterdayList.innerHTML += listItem;
                }
            });
        }

        // Purani Chat Load karne ka function (Wahi se aage start karne ke liye)
        function loadChatSession(id) {
            stopSpeaking();
            let allSessions = JSON.parse(localStorage.getItem('harshit_chat_sessions')) || {};
            if(allSessions[id]) {
                currentChatId = id; // Session switch kar diya
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = allSessions[id].html;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // New Chat Button
        function startNewChat() {
            stopSpeaking();
            currentChatId = 'chat_' + Date.now(); // Naya session ID
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `<div class="message ai-msg">Nayi chat shuru ho gayi hai bhai! Batao Python me aaj kya naya code likhna hai?<button class="copy-btn" onclick="copyText(this)">📋 Copy</button></div>`;
        }

        function searchCodes() {
            let query = prompt("Apne purane codes ya topics me se kya search karna hai?");
            if (query) {
                alert(`"${query}" se jude codes history me check kiye ja rahe hain!`);
            }
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            if(!voiceEnabled) stopSpeaking();
            const btn = document.getElementById('voiceToggleBtn');
            btn.innerText = voiceEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
        }

        function toggleTheme() {
            isMatrixTheme = !isMatrixTheme;
            const body = document.getElementById('bodyTag');
            if (isMatrixTheme) {
                body.classList.add('matrix-theme');
            } else {
                body.classList.remove('matrix-theme');
            }
        }

        function toggleMode() {
            desiModeActive = !desiModeActive;
            const btn = document.getElementById('modeToggleBtn');
            btn.innerText = desiModeActive ? "🔥 Desi: ON" : "🔥 Desi: OFF";
        }

        function insertSnippet() {
            const input = document.getElementById('userInput');
            input.value = "print('Hello from Code with Harshit!')";
            input.focus();
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            stopSpeaking();
            
            const cleanText = text.replace(/[`*#_]/g, '');
            let sentences = cleanText.split(/[.?!]/).filter(s => s.trim().length > 0);
            
            let voices = window.speechSynthesis.getVoices();
            let hindiVoice = voices.find(voice => 
                voice.name.includes('Swara') || voice.name.includes('Hindi') || voice.lang.includes('hi')
            ) || voices[0];

            sentences.forEach((sentence) => {
                let speech = new SpeechSynthesisUtterance(sentence.trim());
                if (hindiVoice) { speech.voice = hindiVoice; }
                speech.lang = 'hi-IN';
                speech.rate = 1.25;
                speech.pitch = 1.0;
                window.speechSynthesis.speak(speech);
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Chat Form Submission
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = userInput.value;
            if (!message.trim()) return;

            stopSpeaking();

            chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
            const currentMsg = message;
            const msgLower = message.toLowerCase();
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Matrix Code Rain Searching Animation
            let searchMsgId = 'search_' + Date.now();
            const randomCodeStream = pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)];
            chatBox.innerHTML += `
                <div class="searching-box" id="${searchMsgId}">
                    ⚡ Scanning Database... <br>
                    <span class="matrix-rain-text">> loading: ${randomCodeStream}</span>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            let codeInterval = setInterval(() => {
                const el = document.getElementById(searchMsgId);
                if(el) {
                    let randomSnippet = pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)];
                    el.innerHTML = `⚡ Compiling Python... <br><span class="matrix-rain-text">> executing: ${randomSnippet}</span>`;
                }
            }, 120);

            let aiReply = "";

            if (msgLower.includes("variable")) {
                aiReply = "Variables ek container ki tarah hote hain jisme hum data store karte hain.\n\nJaise:\nname = 'Harshit'";
            } else if (msgLower.includes("loop") || msgLower.includes("for") || msgLower.includes("while")) {
                aiReply = "Loops ka use code ko repeat karne ke liye hota hai.\n\nJaise:\nfor i in range(5):\n    print(i)";
            } else if (msgLower.includes("function") || msgLower.includes("def")) {
                aiReply = "Function code ka block hota hai jise def keyword se banate hain.";
            } else if (msgLower.includes("kisne banaya") || msgLower.includes("creator")) {
                aiReply = "Mujhe ek genius AI Coder, Harshit Prajapat ne banaya hai!";
            } else {
                try {
                    const response = await fetch('/get_response', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'msg=' + encodeURIComponent(currentMsg) + '&desi=' + desiModeActive
                    });
                    const data = await response.json();
                    aiReply = data.reply;
                } catch (err) {
                    aiReply = "Bhai server se connect karne me network glitch hai, par tera bhai yahin hai!";
                }
            }

            clearInterval(codeInterval);
            const searchElement = document.getElementById(searchMsgId);
            if (searchElement) {
                searchElement.remove();
            }

            let formattedReply = aiReply.replace(/\n/g, '<br>');
            chatBox.innerHTML += `<div class="message ai-msg">${formattedReply}<button class="copy-btn" onclick="copyText(this)">📋 Copy</button></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Save state immediately after message exchange
            saveCurrentChatState();

            if (voiceEnabled) {
                speakText(aiReply);
            }
        });
    </script>
</body>
</html>
